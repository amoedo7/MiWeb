name: WebAMO Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'storeamo.json'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'storeamo.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK identity, permissions and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          mkdir -p dist
          cp "$APK" dist/WebAMO-0.1.2.apk
          unzip -tqq dist/WebAMO-0.1.2.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging dist/WebAMO-0.1.2.apk | tee dist/badging.txt
          grep -q "package: name='com.desarrollamo.webamo' versionCode='3' versionName='0.1.2'" dist/badging.txt
          grep -q "launchable-activity: name='com.desarrollamo.webamo.MainActivity'" dist/badging.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump permissions dist/WebAMO-0.1.2.apk | tee dist/permissions.txt
          grep -q "android.permission.INTERNET" dist/permissions.txt
          if grep -Eq "android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|QUERY_ALL_PACKAGES)" dist/permissions.txt; then
            echo 'Unexpected sensitive permission in WebAMO' >&2
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/WebAMO-0.1.2.apk | tee dist/signature.txt
          sha256sum dist/WebAMO-0.1.2.apk | tee dist/WebAMO-0.1.2.apk.sha256
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt | head -n1 > dist/SIGNING_CERT_SHA256.txt
          test -s dist/SIGNING_CERT_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WebAMO-0.1.2
          path: dist/

      - name: Publish candidate release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.2 >/dev/null 2>&1; then
            gh release upload v0.1.2 dist/WebAMO-0.1.2.apk dist/WebAMO-0.1.2.apk.sha256 dist/SIGNING_CERT_SHA256.txt --clobber
          else
            gh release create v0.1.2 dist/WebAMO-0.1.2.apk dist/WebAMO-0.1.2.apk.sha256 dist/SIGNING_CERT_SHA256.txt \
              --title 'WebAMO v0.1.2' \
              --notes 'WebAMO 0.1.2 conserva la auditoría profunda y el dashboard de 0.1.1 y agrega Copiar informe para llevar el reporte legible directamente al portapapeles, manteniendo Compartir informe y Copiar JSON completo.'
          fi
