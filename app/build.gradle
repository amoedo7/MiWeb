plugins {
    id 'com.android.application'
}

android {
    namespace 'com.desarrollamo.webamo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.desarrollamo.webamo'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.1.1'

        testInstrumentationRunner 'android.app.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
